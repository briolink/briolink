name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # standard library only: no go.sum, nothing to cache (A6)

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: regenerate and diff
        run: go run ./cmd/generate -check

      - name: go test
        run: go test ./...

  author:
    # A22: a pull request is by the bot or the founder, nobody else.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      AUTHOR: ${{ github.event.pull_request.user.login }}
      ALLOWED: briolink-bot[bot] ahmed-boussayri
    steps:
      - name: author is the bot or the founder
        run: |
          for a in $ALLOWED; do
            if [ "$AUTHOR" = "$a" ]; then
              echo "author $AUTHOR is allowed"
              exit 0
            fi
          done
          echo "::error::pull request author '$AUTHOR' is neither the bot nor the founder (A22)"
          exit 1
